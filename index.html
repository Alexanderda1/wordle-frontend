<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 0 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: clamp(24px, 6vw, 32px);
            font-weight: bold;
        }

        .stats {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-size: clamp(11px, 2.5vw, 14px);
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-option {
            flex: 1;
            min-width: 140px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .mode-option:hover {
            border-color: #6aaa64;
        }

        .mode-option.active {
            border-color: #6aaa64;
            background: rgba(106, 170, 100, 0.15);
        }

        .mode-option .mode-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .mode-option .mode-text {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #5f6368);
        }

        .mode-info {
            width: 100%;
            margin-bottom: 15px;
        }

        .mode-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .mode-description {
            margin-top: 6px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #5f6368);
        }

        .game-board {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .tile {
            width: clamp(50px, 12vw, 62px);
            height: clamp(50px, 12vw, 62px);
            border: 2px solid #d3d6da;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 6vw, 32px);
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .tile.filled {
            border-color: #878a8c;
        }

        .tile.correct {
            background-color: #6aaa64;
            border-color: #6aaa64;
            color: white;
        }

        .tile.present {
            background-color: #c9b458;
            border-color: #c9b458;
            color: white;
        }

        .tile.absent {
            background-color: #787c7e;
            border-color: #787c7e;
            color: white;
        }

        .tile.flip-animate {
            animation: flip 0.5s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 15px;
            padding: 0 5px;
            width: 100%;
            max-width: 500px;
        }

        .keyboard-placeholder {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #5f6368);
        }

        .keyboard-row {
            display: flex;
            gap: clamp(3px, 1vw, 6px);
            justify-content: center;
            width: 100%;
        }

        .key {
            min-width: clamp(24px, 7vw, 43px);
            height: clamp(48px, 12vw, 58px);
            background-color: #d3d6da;
            border: none;
            border-radius: 4px;
            font-size: clamp(11px, 3vw, 14px);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            transition: all 0.1s ease;
            flex: 1;
            max-width: clamp(30px, 8vw, 50px);
        }

        .key:active {
            transform: scale(0.95);
        }

        .key.wide {
            flex: 1.5;
            max-width: clamp(50px, 12vw, 65px);
            font-size: clamp(10px, 2.5vw, 12px);
        }

        .key.correct {
            background-color: #6aaa64;
            color: white;
        }

        .key.present {
            background-color: #c9b458;
            color: white;
        }

        .key.absent {
            background-color: #787c7e;
            color: white;
        }

        .message {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .message.show {
            opacity: 1;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }

        .share-btn {
            display: none;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background: #6aaa64;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .share-btn:active {
            background: #5a9a54;
        }

        .view-banner {
            display: none;
            background: #c9b458;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .tile.grid-clickable {
            cursor: pointer;
            border-color: #b8bbbe;
        }

        .tile.grid-clickable:hover {
            border-color: #888;
        }

        .tile.grid-selected {
            border-color: #4a90d9;
            border-width: 3px;
        }

        .tile.grid-path {
            border-color: #c9b458;
            border-width: 3px;
            background: rgba(201, 180, 88, 0.1);
        }

        .tile.grid-path-filled {
            border-color: #c9b458;
            border-width: 3px;
            background: rgba(201, 180, 88, 0.25);
        }

        .direction-buttons {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
            max-width: 320px;
        }

        .dir-btn {
            width: 52px;
            height: 52px;
            border: 2px solid #d3d6da;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            font-size: 22px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .dir-btn:active { transform: scale(0.93); }

        .dir-btn.active {
            border-color: #6aaa64;
            background: rgba(106, 170, 100, 0.2);
        }

        .dir-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .grid-hint {
            text-align: center;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #5f6368);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 WORDGRID</h1>

        <div class="view-banner" id="view-banner">👀 Viewing someone's game</div>

        <div class="stats" id="stats">
            <div class="loading">Loading...</div>
        </div>

        <div class="mode-selector" id="mode-selector">
            <div class="mode-option" data-mode="normal">
                <div class="mode-title">Normal</div>
                <div class="mode-text">Classic daily challenge</div>
            </div>
            <div class="mode-option" data-mode="hard">
                <div class="mode-title">Hard Mode</div>
                <div class="mode-text">Hard mode with 7-letter words</div>
            </div>
            <div class="mode-option" data-mode="grid">
                <div class="mode-title">Grid Mode</div>
                <div class="mode-text">Choose direction each turn</div>
            </div>
        </div>

        <div class="mode-info">
            <div class="mode-pill" id="mode-pill">Select a mode to start</div>
            <div class="mode-description" id="mode-description">
                Pick a mode above to load today's puzzle.
            </div>
        </div>

        <div class="game-board" id="board"></div>

        <div class="grid-hint" id="grid-hint"></div>
        <div class="direction-buttons" id="direction-buttons"></div>

        <button class="share-btn" id="share-btn" onclick="shareResult()">📤 Share my result</button>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <div class="message" id="message"></div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // API URL - ваш Railway backend
        const API_URL = 'https://wordle-beta-wheat.vercel.app/api';
        const MODES = {
            normal: {
                label: 'Normal',
                description: 'Standard Wordle mix. Great for daily warm-up.',
                wordLength: 5
            },
            hard: {
                label: 'Hard Mode',
                description: 'If you want hardcore challenge - 7 letter words!',
                wordLength: 7
            },
            grid: {
                label: 'Grid Mode',
                description: 'Tap a cell, choose direction, guess the word!',
                wordLength: 5
            }
        };

        // Состояние игры
        let gameState = {
            attempts: [],
            currentGuess: '',
            daily_word: '',
            letterStates: {},
            lastAnimatedAttemptIndex: null,
            stats: { played: 0, won: 0, streak: 0 },
            gameOver: false,
            mode: 'normal',
            wordLength: 5
        };
        let currentMode = 'normal';
        let modeSelected = false;

        const KEYBOARD_LAYOUT = [
            ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
            ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫']
        ];

        // Получение user_id из Telegram
        const userId = tg.initDataUnsafe?.user?.id || 'demo';

        // Режим просмотра чужой игры
        const urlParams = new URLSearchParams(window.location.search);
        const viewUserId = urlParams.get('view');
        const viewMode = urlParams.get('mode') || 'normal';
        const isViewMode = !!viewUserId;

        let keyboardListenerAttached = false;

        function attachPhysicalKeyboard() {
            if (keyboardListenerAttached) return;
            keyboardListenerAttached = true;

            window.addEventListener('keydown', (e) => {
                // Игнорируем ввод, если пользователь печатает в элементах формы
                const target = e.target;
                if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
                    return;
                }

                const key = e.key.length === 1 ? e.key.toUpperCase() : e.key.toUpperCase();

                if ((key >= 'A' && key <= 'Z') || key === 'ENTER' || key === 'BACKSPACE') {
                    e.preventDefault();
                }

                if (key === 'ENTER') {
                    handleKeyPress('ENTER');
                } else if (key === 'BACKSPACE') {
                    handleKeyPress('⌫');
                } else if (key.length === 1 && key >= 'A' && key <= 'Z') {
                    handleKeyPress(key);
                }
            });
        }

        // Инициализация игры
        async function initGame() {
            if (!modeSelected) {
                return;
            }

            try {
                setStatsLoading();
                const response = await fetch(`${API_URL}/game/${userId}?mode=${currentMode}`);

                if (!response.ok) {
                    throw new Error('Failed to load game');
                }

                // Загрузка состояния игры с сервера
                const data = await response.json();

                gameState = {
                    ...data,
                    lastAnimatedAttemptIndex: null,
                    currentGuess: '',
                };
                gameState.stats = gameState.stats || { played: 0, won: 0, streak: 0 };
                gameState.mode = data.mode || currentMode;
                gameState.gameOver = data.gameOver || false;
                gameState.wordLength = data.wordLength || MODES[currentMode]?.wordLength || 5;
                currentMode = gameState.mode;
                gameState.lastAnimatedAttemptIndex = null;
                updateModeUI();

                if (currentMode === 'grid') {
                    restoreGridFromAttempts(data.attempts || []);
                    document.getElementById('direction-buttons').style.display = 'none';
                    document.getElementById('grid-hint').textContent = '';
                } else {
                    document.getElementById('direction-buttons').style.display = 'none';
                    document.getElementById('grid-hint').textContent = '';
                }

                // Проверяем не закончилась ли вчерашняя игра
                // Если gameOver и attempts есть - показываем результат, но можно начать новую
                if (data.gameOver && data.attempts && data.attempts.length > 0) {
                    const lastAttemptWasWon = data.attempts[data.attempts.length - 1]?.correct;
                    if (lastAttemptWasWon || data.attempts.length >= 6) {
                        showMessage('Previous game completed. Start a new one!');
                        showShareButton();
                    }
                }

                renderBoard();
                renderKeyboard();
                updateStats();
                attachPhysicalKeyboard();
            } catch (error) {
                console.error('Error loading game:', error);
                showMessage('Error loading game');
            }
        }

        // Отрисовка игрового поля
        function renderBoard() {
            if (currentMode === 'grid') {
                renderGridBoard();
                return;
            }
            const board = document.getElementById('board');
            board.innerHTML = '';
            const wordLength = gameState.wordLength || MODES[currentMode]?.wordLength || 5;

            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'row';

                for (let j = 0; j < wordLength; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';

                    if (i < gameState.attempts.length) {
                        const attempt = gameState.attempts[i];
                        if (attempt.word && attempt.word[j]) {
                            tile.textContent = attempt.word[j];
                            tile.classList.add(attempt.result[j]);
                        }
                        if (gameState.lastAnimatedAttemptIndex === i) {
                            tile.classList.add('flip-animate');
                        }
                    } else if (i === gameState.attempts.length && j < gameState.currentGuess.length) {
                        tile.textContent = gameState.currentGuess[j];
                        tile.classList.add('filled');
                    }

                    row.appendChild(tile);
                }

                board.appendChild(row);
            }

            if (gameState.lastAnimatedAttemptIndex !== null) {
                gameState.lastAnimatedAttemptIndex = null;
            }
        }

        // Отрисовка клавиатуры
        function renderKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';

            if (!modeSelected) {
                keyboard.innerHTML = '<div class="keyboard-placeholder">Select a mode to enable the keyboard.</div>';
                return;
            }

            KEYBOARD_LAYOUT.forEach(row => {
                const keyboardRow = document.createElement('div');
                keyboardRow.className = 'keyboard-row';

                row.forEach(key => {
                    const keyButton = document.createElement('button');
                    keyButton.className = 'key';
                    keyButton.textContent = key;

                    if (key === 'ENTER' || key === '⌫') {
                        keyButton.classList.add('wide');
                    }

                    // Применяем цвет из состояния букв
                    if (gameState.letterStates[key]) {
                        keyButton.classList.add(gameState.letterStates[key]);
                    }

                    keyButton.onclick = () => handleKeyPress(key);
                    keyboardRow.appendChild(keyButton);
                });

                keyboard.appendChild(keyboardRow);
            });
        }

        // Обработка нажатия клавиши
        async function handleKeyPress(key) {
            if (!modeSelected) {
                showMessage('Select a mode to start playing');
                return;
            }
            if (currentMode === 'grid') {
                handleGridKeyPress(key);
                return;
            }
            if (gameState.attempts.length >= 6) {
                showMessage('Game over!');
                return;
            }

            if (key === '⌫') {
                gameState.currentGuess = gameState.currentGuess.slice(0, -1);
                renderBoard();
            } else if (key === 'ENTER') {
                const wordLength = gameState.wordLength || MODES[currentMode]?.wordLength || 5;
                if (gameState.currentGuess.length !== wordLength) {
                    showMessage(`Word must be ${wordLength} letters`);
                    return;
                }

                await submitGuess();
            } else {
                const wordLength = gameState.wordLength || MODES[currentMode]?.wordLength || 5;
                if (gameState.currentGuess.length < wordLength) {
                    gameState.currentGuess += key;
                    renderBoard();
                }
            }
        }

        // Отправка попытки на сервер
        async function submitGuess() {
            try {
                const response = await fetch(`${API_URL}/guess`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        guess: gameState.currentGuess,
                        mode: currentMode
                    })
                });

                const data = await response.json();

                if (!data.valid) {
                    showMessage(data.message);
                    return;
                }

                // Обновляем состояние
                gameState.attempts = data.attempts;
                gameState.letterStates = data.letterStates;
                gameState.currentGuess = '';
                gameState.wordLength = data.wordLength || gameState.wordLength || MODES[currentMode]?.wordLength || 5;
                gameState.lastAnimatedAttemptIndex = data.attempts.length - 1;
                gameState.stats = data.stats || gameState.stats;
                gameState.gameOver = data.gameOver;

                renderBoard();
                renderKeyboard();
                updateStats();

                // Проверка результата
                if (data.won) {
                    setTimeout(() => {
                        showMessage(`🎉 You won in ${data.attempts.length} attempts!`);
                        tg.showAlert(`Congratulations! You won in ${data.attempts.length} attempts!`);
                        showShareButton();
                    }, 1500);
                } else if (data.gameOver) {
                    setTimeout(() => {
                        showMessage(`Game over! Word was: ${data.word}`);
                        tg.showAlert(`Game over! The word was: ${data.word}`);
                        showShareButton();
                    }, 1500);
                }

            } catch (error) {
                console.error('Error submitting guess:', error);
                showMessage('Error submitting guess');
            }
        }

        // Показать сообщение
        function showMessage(text) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.classList.add('show');
            setTimeout(() => {
                message.classList.remove('show');
            }, 2000);
        }

        // Обновить статистику
        function updateStats() {
            const stats = document.getElementById('stats');
            if (!modeSelected) {
                stats.innerHTML = '<div class="loading">Select a mode to start</div>';
                return;
            }
            stats.innerHTML = `
                <div style="display: flex; justify-content: space-around;">
                    <div>
                        <div style="font-size: 24px; font-weight: bold;">${gameState.stats?.played || 0}</div>
                        <div style="font-size: 12px;">Played</div>
                    </div>
                    <div>
                        <div style="font-size: 24px; font-weight: bold;">${gameState.stats?.won || 0}</div>
                        <div style="font-size: 12px;">Won</div>
                    </div>
                    <div>
                        <div style="font-size: 24px; font-weight: bold;">${gameState.stats?.streak || 0}</div>
                        <div style="font-size: 12px;">Streak</div>
                    </div>
                    <div>
                        <div style="font-size: 24px; font-weight: bold;">${gameState.attempts?.length || 0}/6</div>
                        <div style="font-size: 12px;">Today</div>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 11px; color: var(--tg-theme-hint-color, #5f6368);">
                    Mode: ${MODES[currentMode]?.label || currentMode}
                </div>
            `;
        }

        function setStatsLoading() {
            const stats = document.getElementById('stats');
            stats.innerHTML = '<div class="loading">Loading...</div>';
        }

        function updateModeUI() {
            const options = document.querySelectorAll('.mode-option');
            options.forEach(option => {
                const optionMode = option.dataset.mode;
                option.classList.toggle('active', modeSelected && optionMode === currentMode);
            });

            const pill = document.getElementById('mode-pill');
            const description = document.getElementById('mode-description');

            if (modeSelected) {
                pill.textContent = `${MODES[currentMode]?.label || currentMode} mode`;
                description.textContent = MODES[currentMode]?.description || '';
            } else {
                pill.textContent = 'Select a mode to start';
                description.textContent = "Pick a mode above to load today's puzzle.";
            }
        }

        function resetLocalGameState() {
            gameState = {
                attempts: [],
                currentGuess: '',
                daily_word: '',
                letterStates: {},
                lastAnimatedAttemptIndex: null,
                stats: { played: 0, won: 0, streak: 0 },
                gameOver: false,
                mode: currentMode,
                wordLength: MODES[currentMode]?.wordLength || 5
            };
            if (currentMode === 'grid') initGridCells();
            document.getElementById('share-btn').style.display = 'none';
            document.getElementById('direction-buttons').style.display = 'none';
            document.getElementById('grid-hint').textContent = currentMode === 'grid' ? 'Tap a cell to start' : '';
            renderBoard();
            renderKeyboard();
            updateStats();
        }

        function initModeSelector() {
            const options = document.querySelectorAll('.mode-option');
            options.forEach(option => {
                option.addEventListener('click', () => {
                    const selectedMode = option.dataset.mode;
                    if (modeSelected && selectedMode === currentMode) {
                        return;
                    }

                    if (modeSelected && gameState.attempts.length > 0 && !gameState.gameOver) {
                        const confirmSwitch = window.confirm('Switching modes will reset today\'s progress. Continue?');
                        if (!confirmSwitch) {
                            return;
                        }
                    }

                    currentMode = selectedMode;
                    modeSelected = true;
                    gameState.currentGuess = '';
                    updateModeUI();
                    resetLocalGameState();
                    initGame();
                });
            });
        }

        // ==================== GRID MODE ====================

        const GRID_ROWS = 6;
        const GRID_COLS = 5;
        const GRID_WORD_LEN = 5;

        const DIRECTIONS = [
            { dr: 0,  dc:  1, label: '→' },
            { dr:  1, dc:  0, label: '↓' },
            { dr:  0, dc: -1, label: '←' },
            { dr: -1, dc:  0, label: '↑' },
            { dr:  1, dc:  1, label: '↘' },
            { dr:  1, dc: -1, label: '↙' },
            { dr: -1, dc:  1, label: '↗' },
            { dr: -1, dc: -1, label: '↖' },
        ];

        let gridCells = Array.from({ length: 6 }, () => Array(5).fill(null));
        let gridSelected = null;   // { row, col }
        let gridDirection = null;  // элемент из DIRECTIONS
        let gridInput = '';

        function initGridCells() {
            gridCells = Array.from({ length: GRID_ROWS }, () => Array(GRID_COLS).fill(null));
            gridSelected = null;
            gridDirection = null;
            gridInput = '';
        }

        function getGridPath(row, col, dir) {
            const path = [];
            for (let i = 0; i < GRID_WORD_LEN; i++) {
                const r = row + dir.dr * i;
                const c = col + dir.dc * i;
                if (r < 0 || r >= GRID_ROWS || c < 0 || c >= GRID_COLS) return null;
                if (gridCells[r][c] !== null) return null;
                path.push({ row: r, col: c });
            }
            return path;
        }

        function restoreGridFromAttempts(attempts) {
            initGridCells();
            for (const attempt of attempts) {
                if (!attempt.start_cell || !attempt.direction) continue;
                const { row, col } = attempt.start_cell;
                const dir = attempt.direction;
                for (let i = 0; i < attempt.word.length; i++) {
                    const r = row + dir.dr * i;
                    const c = col + dir.dc * i;
                    if (r >= 0 && r < GRID_ROWS && c >= 0 && c < GRID_COLS) {
                        gridCells[r][c] = { letter: attempt.word[i], state: attempt.result[i] };
                    }
                }
            }
        }

        function renderGridBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            let currentPath = [];
            if (gridSelected && gridDirection) {
                const path = getGridPath(gridSelected.row, gridSelected.col, gridDirection);
                if (path) currentPath = path;
            }
            const pathMap = {};
            currentPath.forEach((p, i) => { pathMap[`${p.row},${p.col}`] = i; });

            for (let r = 0; r < GRID_ROWS; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';

                for (let c = 0; c < GRID_COLS; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    const cell = gridCells[r][c];
                    const key = `${r},${c}`;

                    const isSelected = gridSelected && gridSelected.row === r && gridSelected.col === c;
                    const isInPath = key in pathMap;

                    if (cell) {
                        tile.textContent = cell.letter;
                        tile.classList.add(cell.state);
                    } else if (isInPath) {
                        const idx = pathMap[key];
                        if (idx < gridInput.length) {
                            tile.textContent = gridInput[idx];
                            tile.classList.add(isSelected ? 'grid-selected' : 'grid-path-filled');
                        } else {
                            tile.classList.add(isSelected ? 'grid-selected' : 'grid-path');
                        }
                        tile.addEventListener('click', () => handleGridCellTap(r, c));
                    } else if (isSelected) {
                        tile.classList.add('grid-selected');
                        tile.addEventListener('click', () => handleGridCellTap(r, c));
                    } else {
                        tile.classList.add('grid-clickable');
                        tile.addEventListener('click', () => handleGridCellTap(r, c));
                    }

                    rowEl.appendChild(tile);
                }
                board.appendChild(rowEl);
            }
        }

        function handleGridCellTap(row, col) {
            if (gameState.gameOver) return;
            gridSelected = { row, col };
            gridDirection = null;
            gridInput = '';
            document.getElementById('grid-hint').textContent = 'Choose direction:';
            renderGridBoard();
            renderDirectionButtons();
        }

        function renderDirectionButtons() {
            const container = document.getElementById('direction-buttons');
            if (!gridSelected) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            container.innerHTML = '';

            DIRECTIONS.forEach(dir => {
                const path = getGridPath(gridSelected.row, gridSelected.col, dir);
                const btn = document.createElement('button');
                btn.className = 'dir-btn';
                btn.textContent = dir.label;
                btn.disabled = !path;
                if (gridDirection && gridDirection.dr === dir.dr && gridDirection.dc === dir.dc) {
                    btn.classList.add('active');
                }
                btn.addEventListener('click', () => {
                    if (!path) return;
                    gridDirection = dir;
                    gridInput = '';
                    document.getElementById('grid-hint').textContent = `Direction ${dir.label} — type your word:`;
                    renderGridBoard();
                    renderDirectionButtons();
                });
                container.appendChild(btn);
            });
        }

        function handleGridKeyPress(key) {
            if (gameState.gameOver) { showMessage('Game over!'); return; }
            if (!gridSelected) { showMessage('Tap a cell to start'); return; }
            if (!gridDirection) { showMessage('Choose a direction'); return; }

            if (key === '⌫') {
                gridInput = gridInput.slice(0, -1);
                renderGridBoard();
            } else if (key === 'ENTER') {
                if (gridInput.length !== GRID_WORD_LEN) {
                    showMessage(`Enter ${GRID_WORD_LEN} letters`);
                    return;
                }
                submitGridGuess();
            } else {
                if (gridInput.length < GRID_WORD_LEN) {
                    gridInput += key;
                    renderGridBoard();
                }
            }
        }

        async function submitGridGuess() {
            try {
                const response = await fetch(`${API_URL}/guess`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        guess: gridInput,
                        mode: 'grid',
                        start_cell: gridSelected,
                        direction: { dr: gridDirection.dr, dc: gridDirection.dc }
                    })
                });

                const data = await response.json();

                if (!data.valid) {
                    showMessage(data.message);
                    return;
                }

                const lastAttempt = data.attempts[data.attempts.length - 1];
                const path = getGridPath(gridSelected.row, gridSelected.col, gridDirection);
                path.forEach((cell, i) => {
                    gridCells[cell.row][cell.col] = { letter: gridInput[i], state: lastAttempt.result[i] };
                });

                gameState.attempts = data.attempts;
                gameState.letterStates = data.letterStates;
                gameState.stats = data.stats || gameState.stats;
                gameState.gameOver = data.gameOver;

                gridSelected = null;
                gridDirection = null;
                gridInput = '';
                document.getElementById('direction-buttons').style.display = 'none';
                document.getElementById('grid-hint').textContent = gameState.gameOver ? '' : 'Tap a cell to continue';

                renderGridBoard();
                renderKeyboard();
                updateStats();

                if (data.won) {
                    setTimeout(() => {
                        showMessage(`🎉 Won in ${data.attempts.length} attempts!`);
                        tg.showAlert(`You won in ${data.attempts.length} attempts!`);
                        showShareButton();
                    }, 800);
                } else if (data.gameOver) {
                    setTimeout(() => {
                        showMessage(`Game over! Word: ${data.word}`);
                        tg.showAlert(`Game over! The word was: ${data.word}`);
                        showShareButton();
                    }, 800);
                }
            } catch (e) {
                console.error(e);
                showMessage('Error submitting guess');
            }
        }

        // ==================== /GRID MODE ====================

        function generateEmojiGrid(attempts) {
            const map = { correct: '🟩', present: '🟨', absent: '⬛' };
            return attempts.map(a => a.result.map(r => map[r] || '⬛').join('')).join('\n');
        }

        function shareResult() {
            const emoji = generateEmojiGrid(gameState.attempts);
            const won = gameState.attempts.length > 0 && gameState.attempts[gameState.attempts.length - 1]?.correct;
            const attemptsText = won ? `${gameState.attempts.length}/6` : 'X/6';
            const modeLabel = currentMode === 'hard' ? 'Hard Mode' : currentMode === 'grid' ? 'Grid Mode' : 'Normal';
            const text = `WORDGRID ${modeLabel} ${attemptsText}\n\n${emoji}\n\nСмотри мой результат! Поиграть можешь здесь: @WordGridTumgubot`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent('https://t.me/WordGridTumgubot')}&text=${encodeURIComponent(text)}`);
        }

        function showShareButton() {
            const btn = document.getElementById('share-btn');
            if (btn) btn.style.display = 'block';
        }

        async function loadViewMode() {
            document.getElementById('view-banner').style.display = 'block';
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('mode-info').style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/history/${viewUserId}?mode=${viewMode}`);
                const data = await res.json();

                currentMode = viewMode;
                modeSelected = true;
                gameState = {
                    attempts: data.attempts || [],
                    currentGuess: '',
                    letterStates: data.letterStates || {},
                    lastAnimatedAttemptIndex: null,
                    stats: { played: 0, won: 0, streak: 0 },
                    gameOver: data.gameOver || false,
                    mode: viewMode,
                    wordLength: data.wordLength || 5
                };

                renderBoard();
                renderKeyboard();

                const won = data.attempts?.length > 0 && data.attempts[data.attempts.length - 1]?.correct;
                if (data.gameOver) {
                    const attemptsText = won ? `${data.attempts.length}/6` : 'X/6';
                    showMessage(won ? `Won in ${attemptsText}!` : `Game over! Word: ${data.word}`);
                }

                const stats = document.getElementById('stats');
                stats.innerHTML = `<div style="font-size:13px;color:var(--tg-theme-hint-color,#5f6368)">
                    ${data.attempts?.length || 0} attempt(s) · ${currentMode === 'hard' ? 'Hard Mode' : 'Normal'}
                    ${data.gameOver ? (won ? ' · 🏆 Won' : ' · ❌ Lost') : ' · In progress'}
                </div>`;
            } catch (e) {
                showMessage('Failed to load game');
            }
        }

        // Запуск игры
        updateModeUI();
        renderBoard();
        renderKeyboard();
        updateStats();
        initModeSelector();

        if (isViewMode) {
            loadViewMode();
        }
    </script>
</body>
